  <ellipse cx="45" cy="58" rx="12" ry="10" fill="#F8FAFC"/>
  <ellipse cx="65" cy="58" rx="12" ry="10" fill="#F8FAFC"/>
  
  <!-- Cloud shadow/depth -->
